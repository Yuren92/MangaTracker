<article class="collection-card">
  <div class="cover">
    @if (item().imageUrl) {
      <img [src]="item().imageUrl" [alt]="item().title" />
    } @else {
      <div class="no-image">Sin imagen</div>
    }
  </div>

  <div class="card-content">
    <h2>{{ item().title }}</h2>

    <p class="meta">
      MAL ID: {{ item().malId }}
    </p>

    <div class="stats">
      <div>
        <span>Comprados</span>
        <strong>{{ item().ownedVolumesCount }}</strong>
      </div>

      <div>
        <span>Faltan</span>
        <strong>{{ item().missingVolumesCount }}</strong>
      </div>

      <div>
        <span>Total</span>
        <strong>{{ item().effectiveTotalVolumes ?? '—' }}</strong>
      </div>
    </div>

    <div class="actions">
      <a [routerLink]="['/collection', item().id]" class="secondary-link">
        Ver detalle
      </a>

      <button
        type="button"
        class="danger-button"
        [disabled]="removingItemId() === item().id"
        (click)="onRemove()"
      >
        @if (removingItemId() === item().id) {
          Quitando...
        } @else {
          Quitar
        }
      </button>
    </div>
  </div>
</article>
