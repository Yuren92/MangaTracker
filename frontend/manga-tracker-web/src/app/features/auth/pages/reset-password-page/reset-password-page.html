<section class="auth-card">
  <h1>Restablecer contraseña</h1>

  <p class="subtitle">
    Introduce tu nueva contraseña.
  </p>

  <app-alert type="error" [message]="errorMessage()" />
  <app-alert type="success" [message]="successMessage()" />

  @if (successMessage()) {
    <a routerLink="/login" class="button-link">
      Ir al login
    </a>
  }

  @if (!successMessage()) {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Nueva contraseña

        <input
          type="password"
          formControlName="newPassword"
          placeholder="Mínimo 8 caracteres, mayúscula, minúscula y número"
        />
      </label>

      @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
        <p class="field-error">
          La nueva contraseña es obligatoria.
        </p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          Cambiando...
        } @else {
          Cambiar contraseña
        }
      </button>
    </form>
  }

  <div class="links">
    <a routerLink="/login">Volver al login</a>
  </div>
</section>
