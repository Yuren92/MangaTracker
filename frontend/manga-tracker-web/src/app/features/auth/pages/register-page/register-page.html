<section class="auth-card">
  <h1>Crear cuenta</h1>

  <p class="subtitle">
    Regístrate para empezar a gestionar tu colección de manga.
  </p>

  <app-alert type="error" [message]="errorMessage()" />
  <app-alert type="success" [message]="successMessage()" />

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email

      <input
        type="email"
        formControlName="email"
        placeholder="pedro@test.com"
      />
    </label>

    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="field-error">
        Introduce un email válido.
      </p>
    }

    <label>
      Contraseña

      <input
        type="password"
        formControlName="password"
        placeholder="Mínimo 8 caracteres, mayúscula, minúscula y número"
      />
    </label>

    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="field-error">
        La contraseña es obligatoria.
      </p>
    }

    <button type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        Creando cuenta...
      } @else {
        Crear cuenta
      }
    </button>
  </form>

  <div class="links">
    <a routerLink="/login">Ya tengo cuenta</a>
  </div>
</section>
