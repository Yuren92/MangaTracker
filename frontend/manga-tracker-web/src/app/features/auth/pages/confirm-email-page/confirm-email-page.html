<section class="auth-card">
  <h1>Confirmar email</h1>

  @if (isLoading()) {
    <p class="subtitle">
      Confirmando tu cuenta...
    </p>
  }

  @if (isConfirmed()) {
    <app-alert type="success" message="Email confirmado." />

    <p>
      Tu cuenta ya está activa. Ahora puedes iniciar sesión.
    </p>

    <a routerLink="/login" class="button-link">
      Ir al login
    </a>
  }

  @if (errorMessage()) {
    <app-alert type="error" [message]="errorMessage()" />

    <p>
      El enlace puede haber caducado o ya haber sido usado.
    </p>

    <a routerLink="/resend-confirmation" class="button-link">
      Pedir otro enlace
    </a>
  }
</section>
