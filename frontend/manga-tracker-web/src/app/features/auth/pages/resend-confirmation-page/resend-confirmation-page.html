<section class="auth-card">
  <h1>Reenviar confirmación</h1>

  <p class="subtitle">
    Si no te ha llegado el correo para confirmar tu cuenta o el enlace ha caducado,
    te enviamos otro.
  </p>

  <app-alert type="error" [message]="errorMessage()" />
  <app-alert type="success" [message]="successMessage()" />

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email

      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="tu@email.com"
      />
    </label>

    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="field-error">
        Introduce un email válido.
      </p>
    }

    <button type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        Enviando...
      } @else {
        Enviar enlace de confirmación
      }
    </button>
  </form>

  <div class="links">
    <a routerLink="/login">Volver al login</a>
  </div>
</section>
