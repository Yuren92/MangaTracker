<article class="manga-card">
  <div class="cover">
    @if (imageUrl()) {
      <img [src]="imageUrl()" [alt]="title()" />
    } @else {
      <div class="no-image">
        Sin imagen
      </div>
    }
  </div>

  <div class="manga-info">
    <h2>{{ title() }}</h2>

    @if (subtitle()) {
      <p>
        {{ subtitle() }}
      </p>
    }

    <a [routerLink]="detailLink()">
      {{ actionText() }}
    </a>
  </div>
</article>
