<div class="app-shell">
  <header class="app-header">
    <a routerLink="/" class="brand" aria-label="Manga Tracker, ir a mi estantería">
      Manga<span>Tracker</span>
    </a>

    <nav class="nav" aria-label="Navegación principal">
      @if (authState.isAuthenticated()) {
        <!-- Also active inside a series (/collections/:id): it is part of the shelf. -->
        <a routerLink="/collections" routerLinkActive="active" ariaCurrentWhenActive="page">Estantería</a>
        <a routerLink="/pending" routerLinkActive="active" ariaCurrentWhenActive="page">Me faltan</a>
        <a routerLink="/catalog/search" routerLinkActive="active" ariaCurrentWhenActive="page">Añadir serie</a>

        <div class="user-menu">
          <button
            type="button"
            class="user-menu-button"
            aria-controls="user-menu-panel"
            [attr.aria-expanded]="isUserMenuOpen()"
            [attr.aria-label]="'Mi cuenta' + (authState.currentUser() ? ': ' + authState.currentUser()!.email : '')"
            (click)="toggleUserMenu()"
          >
            <span class="avatar" aria-hidden="true">{{ initial() }}</span>
          </button>

          @if (isUserMenuOpen()) {
            <!-- Disclosure pattern (button + aria-expanded), not an ARIA menu: role="menu"
                 would promise arrow-key navigation that a two-link panel does not need. -->
            <div class="user-menu-panel" id="user-menu-panel">
              @if (authState.currentUser(); as user) {
                <p class="user-email">{{ user.email }}</p>
              }

              <a routerLink="/change-password" (click)="closeUserMenu()">
                Cambiar contraseña
              </a>

              <button type="button" (click)="logout()">
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Iniciar sesión</a>
        <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page">Crear cuenta</a>
      }
    </nav>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
