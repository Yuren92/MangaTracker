<div class="app-shell">
  <header class="app-header">
    <a routerLink="/" class="brand">
      Manga Tracker
    </a>

    <nav class="nav" aria-label="Navegación principal">
      @if (authState.isAuthenticated()) {
        <a routerLink="/catalog/search" routerLinkActive="active" ariaCurrentWhenActive="page">Buscar</a>
        <a
          routerLink="/collections"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }"
        >Mis colecciones</a>
        <a routerLink="/collections/pending-tomes" routerLinkActive="active" ariaCurrentWhenActive="page">Pendientes</a>

        <div class="user-menu">
          <button
            type="button"
            class="user-menu-button"
            aria-controls="user-menu-panel"
            [attr.aria-expanded]="isUserMenuOpen()"
            (click)="toggleUserMenu()"
          >
            <span class="user-menu-label">
              @if (authState.currentUser(); as user) {
                {{ user.email }}
              } @else {
                Mi cuenta
              }
            </span>

            <span aria-hidden="true">▾</span>
          </button>

          @if (isUserMenuOpen()) {
            <!-- Disclosure pattern (button + aria-expanded), not an ARIA menu: role="menu"
                 would promise arrow-key navigation that a two-link panel does not need. -->
            <div class="user-menu-panel" id="user-menu-panel">
              <a routerLink="/change-password" (click)="closeUserMenu()">
                Cambiar contraseña
              </a>

              <button type="button" (click)="logout()">
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Iniciar sesión</a>
        <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page">Crear cuenta</a>
      }
    </nav>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
