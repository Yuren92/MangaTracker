<div class="app-shell">
  <header class="app-header">
    <a routerLink="/" class="brand">
      Manga Tracker
    </a>

    <nav class="nav">
      @if (authState.isAuthenticated()) {
        <a routerLink="/catalog/search">Buscar</a>
        <a routerLink="/collections">Mis colecciones</a>
        <a routerLink="/collections/pending-tomes">Pendientes</a>

        <div class="user-menu">
          <button
            type="button"
            class="user-menu-button"
            (click)="toggleUserMenu()"
          >
            <span class="user-menu-label">
              @if (authState.currentUser(); as user) {
                {{ user.email }}
              } @else {
                Mi cuenta
              }
            </span>

            <span aria-hidden="true">▾</span>
          </button>

          @if (isUserMenuOpen()) {
            <div class="user-menu-panel">
              <a routerLink="/change-password" (click)="closeUserMenu()">
                Cambiar contraseña
              </a>

              <button type="button" (click)="logout()">
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      }

      @if (!authState.isAuthenticated()) {
        <a routerLink="/login">Login</a>
        <a routerLink="/register">Registro</a>
      }
    </nav>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
