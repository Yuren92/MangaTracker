name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway container that only exists for this job; not a real secret.
          MSSQL_SA_PASSWORD: "Ci-Only-Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-Only-Passw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_NOLOGO: "true"
      MANGATRACKER_TEST_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=Ci-Only-Passw0rd!;TrustServerCertificate=True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MangaTracker.slnx

      - name: Fail on vulnerable packages
        run: |
          dotnet list MangaTracker.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q -i "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: Build
        run: dotnet build MangaTracker.slnx --no-restore --configuration Release -warnaserror

      - name: Test (unit + integration against SQL Server)
        run: dotnet test MangaTracker.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/manga-tracker-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/manga-tracker-web/package-lock.json

      - name: Install
        run: npm ci

      # Only what ships to the browser gates the build. The remaining dev-only
      # advisories live inside the Angular CLI/build tooling and can only be
      # fixed upstream.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Only-Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-Only-Passw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    # appsettings.Development.json is not in the repository, so the API gets its
    # Development configuration from the environment. No Comic Vine key here: the
    # catalog test detects that and skips itself.
    env:
      DOTNET_NOLOGO: "true"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MangaTrackerDb: "Server=localhost,1433;Database=MangaTrackerE2E;User Id=sa;Password=Ci-Only-Passw0rd!;TrustServerCertificate=True"
      Jwt__SecretKey: "ci-only-development-signing-key-of-sufficient-length"
      AuthLinks__FrontendBaseUrl: "http://localhost:4200"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      ComicVine__ApiKey: "not-configured-in-ci"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/manga-tracker-web/package-lock.json

      - name: Build API
        run: dotnet build src/MangaTracker.Api

      - name: Create database
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update --project src/MangaTracker.Infrastructure --startup-project src/MangaTracker.Api --no-build

      - name: Install frontend and browser
        working-directory: frontend/manga-tracker-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend/manga-tracker-web
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/manga-tracker-web/playwright-report
            frontend/manga-tracker-web/e2e/.artifacts/api.log
